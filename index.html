<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 주식투자 분석기 (RICE All-in-One) · 1장~13장 통합 프롬프트 생성기</title>
  <meta name="description" content="AI(제미나이, ChatGPT, Claude)를 활용한 주식 투자 분석 맞춤형 프롬프트 생성기. 1장 모닝브리핑부터 13장 미래지도까지 올인원 지원">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <style>
    :root {
      --primary: #0B1D2E;
      --primary-mid: #132D4A;
      --primary-light: #1A4B7A;
      --primary-pale: #E3EDF7;
      --accent: #C8963A;
      --accent-light: #F5E6C8;
      --accent-dark: #A67C2E;
      --dark: #0A0F14;
      --gray-900: #1A202C;
      --gray-800: #2D3748;
      --gray-700: #4A5568;
      --gray-500: #718096;
      --gray-400: #A0AEC0;
      --gray-300: #CBD5E0;
      --gray-200: #E2E8F0;
      --gray-100: #F7FAFC;
      --gray-50: #FAFBFD;
      --bg: #F0EDE8;
      --white: #FFFFFF;
      --gradient-hero: linear-gradient(160deg, #0B1D2E 0%, #132D4A 40%, #1A4B7A 100%);
      --gradient-gold: linear-gradient(135deg, #C8963A 0%, #D4A94C 50%, #E0C068 100%);
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
      --shadow-gold: 0 4px 20px rgba(200,150,58,0.25);
      --r: 14px;
      --r-lg: 20px;
      --r-xl: 28px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--gray-900);
      line-height: 1.65; -webkit-font-smoothing: antialiased;
    }
    .hide-scrollbar::-webkit-scrollbar { display:none; }
    .hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

    /* HERO */
    .hero {
      background: var(--gradient-hero); color: white;
      padding: 44px 20px 32px; position: relative; overflow: hidden;
    }
    .hero::before {
      content:''; position:absolute; top:-30%; right:-10%;
      width:500px; height:500px;
      background: radial-gradient(circle, rgba(200,150,58,0.1) 0%, transparent 65%);
      border-radius:50%;
    }
    .hero-inner { max-width:1000px; margin:0 auto; position:relative; z-index:1; }
    .hero-badge {
      display:inline-flex; align-items:center; gap:6px;
      background: rgba(200,150,58,0.2); border:1px solid rgba(200,150,58,0.35);
      border-radius:100px; padding:5px 14px;
      font-size:11px; font-weight:700; color:var(--accent-light);
      letter-spacing:0.5px; margin-bottom:14px;
    }
    .hero-badge::before { content:''; width:6px; height:6px; background:var(--accent); border-radius:50%; }
    .hero-title { font-size:30px; font-weight:900; line-height:1.2; margin-bottom:8px; }
    .hero-title span { color: var(--accent); }
    .hero-sub { font-size:13px; color:rgba(255,255,255,0.6); font-weight:400; }

    /* NAV */
    .nav-row { display:flex; flex-wrap:wrap; gap:8px 6px; margin-top:22px; padding-bottom:4px; }
    .nav-pill {
      padding:8px 15px; border-radius:100px; border:1px solid rgba(255,255,255,0.12);
      font-size:12px; font-weight:600; white-space:nowrap; cursor:pointer;
      transition:all .25s; background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.7);
      font-family:inherit;
    }
    .nav-pill:hover { background:rgba(255,255,255,0.18); color:white; }
    .nav-pill.active { background:var(--accent); color:white; border-color:var(--accent); box-shadow:var(--shadow-gold); }

    /* MAIN */
    .main { max-width:1000px; margin:0 auto; padding:0 20px 80px; }

    /* HOME */
    .home-section { padding-top:28px; }
    .home-label {
      font-size:12px; font-weight:700; color:var(--primary);
      text-transform:uppercase; letter-spacing:1.5px;
      margin-bottom:16px; display:flex; align-items:center; gap:10px;
    }
    .home-label::before { content:''; width:20px; height:2px; background:var(--accent); }
    .cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:32px; }
    .cat-card {
      background:var(--white); border-radius:var(--r-lg); padding:20px 14px;
      border:1px solid rgba(0,0,0,0.04); box-shadow:var(--shadow-sm);
      cursor:pointer; transition:all .3s cubic-bezier(.4,0,.2,1);
      text-align:center; position:relative; overflow:hidden;
    }
    .cat-card::after {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      background:var(--gradient-gold); opacity:0; transition:opacity .3s;
    }
    .cat-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); }
    .cat-card:hover::after { opacity:1; }
    .cat-icon { font-size:26px; margin-bottom:6px; display:block; }
    .cat-name { font-size:12.5px; font-weight:700; color:var(--dark); margin-bottom:2px; }
    .cat-desc { font-size:10px; color:var(--gray-500); line-height:1.4; }

    /* GUIDE */
    .guide-card {
      background:var(--white); border-radius:var(--r-xl); padding:28px 22px;
      box-shadow:var(--shadow-md); border:1px solid rgba(0,0,0,0.03); margin-bottom:16px;
    }
    .guide-card h3 { font-size:17px; font-weight:800; color:var(--dark); margin-bottom:18px; }
    .rice-steps { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .rice-step {
      background:var(--gray-50); border-radius:var(--r); padding:16px 14px;
      border-left:4px solid var(--accent);
    }
    .rice-letter { font-size:22px; font-weight:900; color:var(--accent); line-height:1; margin-bottom:3px; }
    .rice-label { font-size:12px; font-weight:700; color:var(--dark); margin-bottom:3px; }
    .rice-explain { font-size:10.5px; color:var(--gray-500); line-height:1.5; }
    .howto-steps { display:flex; flex-direction:column; gap:14px; }
    .howto-step { display:flex; gap:14px; align-items:flex-start; }
    .howto-num {
      width:32px; height:32px; min-width:32px; background:var(--gradient-hero);
      color:white; border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:13px; font-weight:800;
    }
    .howto-content h4 { font-size:13px; font-weight:700; color:var(--dark); margin-bottom:2px; }
    .howto-content p { font-size:11.5px; color:var(--gray-500); line-height:1.6; }

    /* SECTION HEADER */
    .sec-head { margin-bottom:22px; margin-top:28px; }
    .sec-tag {
      display:inline-flex; align-items:center; gap:8px;
      font-size:11px; font-weight:700; color:var(--primary);
      text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px;
    }
    .sec-tag::before { content:''; width:20px; height:2px; background:var(--accent); }
    .sec-title { font-size:21px; font-weight:800; color:var(--dark); margin-bottom:4px; }
    .sec-desc { font-size:12px; color:var(--gray-500); }

    /* CARDS */
    .card {
      background:var(--white); border-radius:var(--r-lg); padding:22px;
      box-shadow:var(--shadow-sm); border:1px solid rgba(0,0,0,0.03);
    }
    .card-xl { padding:26px; border-radius:var(--r-xl); }

    /* OPTION BUTTONS */
    .option-buttons-group { margin-bottom:18px; }
    .option-buttons-label { font-size:12.5px; font-weight:700; color:var(--dark); margin-bottom:10px; display:block; }
    .option-buttons { display:grid; gap:8px; }
    .option-buttons.cols-2 { grid-template-columns:repeat(2,1fr); }
    .option-buttons.cols-3 { grid-template-columns:repeat(3,1fr); }
    .option-buttons.cols-4 { grid-template-columns:repeat(4,1fr); }
    .option-buttons.cols-5 { grid-template-columns:repeat(5,1fr); }
    .option-btn {
      padding:11px 14px; border:2px solid var(--gray-200); border-radius:var(--r);
      background:var(--white); color:var(--gray-700); font-size:13px; font-weight:600;
      cursor:pointer; transition:all .25s; font-family:inherit;
    }
    .option-btn:hover { border-color:var(--primary); color:var(--primary); }
    .option-btn.active {
      background:var(--primary); color:white; border-color:var(--primary);
      box-shadow:0 4px 12px rgba(11,29,46,0.2);
    }

    /* SECTOR GRID */
    .sector-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px; }
    .sector-btn {
      padding:10px 8px; border:2px solid var(--gray-200); border-radius:var(--r);
      background:white; color:var(--gray-700); font-size:11.5px; font-weight:600;
      cursor:pointer; transition:all .25s; font-family:inherit; text-align:center;
    }
    .sector-btn:hover { border-color:var(--primary); color:var(--primary); }
    .sector-btn.active { background:var(--primary); color:white; border-color:var(--primary); }

    /* DROPDOWN */
    .dropdown-group { margin-bottom:18px; }
    .dropdown-label { font-size:12.5px; font-weight:700; color:var(--dark); margin-bottom:8px; display:block; }
    .dropdown {
      width:100%; padding:11px 40px 11px 14px;
      border:2px solid var(--gray-200); border-radius:var(--r);
      background:var(--white); color:var(--gray-900);
      font-size:13px; font-weight:500; font-family:inherit;
      cursor:pointer; appearance:none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231A202C' stroke-width='2'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
      background-repeat:no-repeat; background-position:right 12px center; background-size:14px;
    }
    .dropdown:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(11,29,46,0.08); }

    /* STOCK SELECTOR */
    .stock-selector { margin-bottom:22px; }
    .stock-search { display:flex; gap:8px; margin-bottom:12px; }
    .stock-search-input {
      flex:1; padding:11px 14px; border:2px solid var(--gray-200);
      border-radius:var(--r); font-size:13px; font-family:inherit; transition:all .25s;
    }
    .stock-search-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(11,29,46,0.08); }
    .stock-search-btn {
      padding:11px 18px; background:var(--primary); color:white; border:none;
      border-radius:var(--r); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
    }
    .stock-search-btn:hover { background:var(--primary-light); }
    .stock-list {
      max-height:180px; overflow-y:auto; border:1px solid var(--gray-200);
      border-radius:var(--r); margin-bottom:12px;
    }
    .stock-item {
      padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--gray-100);
      transition:all .15s; font-size:13px;
    }
    .stock-item:last-child { border-bottom:none; }
    .stock-item:hover { background:var(--primary-pale); color:var(--primary); }
    .selected-stocks { display:flex; flex-wrap:wrap; gap:8px; }
    .stock-tag {
      display:inline-flex; align-items:center; gap:6px; padding:7px 12px;
      background:linear-gradient(135deg, rgba(11,29,46,0.06), rgba(200,150,58,0.04));
      border:1px solid var(--primary-mid); border-radius:100px;
      font-size:12px; font-weight:600; color:var(--primary);
    }
    .stock-tag-remove { cursor:pointer; opacity:0.5; font-weight:700; }
    .stock-tag-remove:hover { opacity:1; }

    /* BUTTONS */
    .btn { padding:14px 24px; border:none; border-radius:var(--r); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .25s; }
    .btn-primary { background:var(--gradient-hero); color:white; width:100%; }
    .btn-primary:hover { box-shadow:0 8px 28px rgba(11,29,46,0.3); transform:translateY(-2px); }
    .btn-primary:active { transform:translateY(0); }
    .btn-secondary { background:var(--gradient-gold); color:white; width:100%; }
    .btn-copy { background:var(--primary); color:white; padding:9px 16px; font-size:12px; border-radius:var(--r); border:none; cursor:pointer; font-family:inherit; font-weight:600; }
    .btn-copy:hover { background:var(--primary-light); }

    /* PROMPT */
    .prompt-container { position:relative; margin-bottom:22px; margin-top:26px; background:var(--white); border-radius:var(--r-xl); box-shadow:var(--shadow-md); overflow:hidden; border:1px solid rgba(0,0,0,0.03); }
    .prompt-header-bar { height:4px; background:var(--gradient-gold); }
    .prompt-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding:22px 22px 0; }
    .prompt-header h3 { font-size:16px; font-weight:800; color:var(--dark); }
    .prompt-textarea {
      width:calc(100% - 44px); margin:0 22px; height:300px; padding:16px;
      border:2px solid var(--gray-200); border-radius:var(--r);
      font-size:12px; font-family:'Noto Sans KR', monospace;
      color:var(--gray-700); resize:none; background:var(--gray-50); line-height:1.7;
    }
    .prompt-textarea:focus { outline:none; border-color:var(--primary); }
    .prompt-note {
      margin:12px 22px 22px; padding:12px 16px;
      background:linear-gradient(135deg, rgba(11,29,46,0.04), rgba(200,150,58,0.04));
      border:1px solid var(--primary-pale); border-radius:var(--r);
      font-size:12px; color:var(--primary); font-weight:500;
    }

    /* INFO BOXES */
    .info-box { margin-top:12px; padding:12px 16px; border-radius:var(--r); font-size:12px; border:1px solid; line-height:1.6; }
    .info-box-blue { background:rgba(11,29,46,0.04); border-color:var(--primary-pale); color:var(--primary); }
    .info-box-gold { background:rgba(200,150,58,0.04); border-color:var(--accent-light); color:var(--accent-dark); }
    .info-box-red { background:rgba(220,38,38,0.04); border-color:rgba(220,38,38,0.15); color:#DC2626; }
    .info-box strong { font-weight:700; display:block; margin-bottom:3px; }

    /* TERMS */
    .term-category-tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
    .term-category-tab {
      padding:9px 14px; border:2px solid var(--gray-200); border-radius:var(--r);
      background:white; color:var(--gray-700); font-size:12px; font-weight:600;
      cursor:pointer; transition:all .25s; font-family:inherit;
    }
    .term-category-tab:hover { border-color:var(--primary); color:var(--primary); }
    .term-category-tab.active { background:var(--primary); color:white; border-color:var(--primary); }
    .term-card { background:white; border:2px solid var(--gray-200); border-radius:var(--r); margin-bottom:10px; overflow:hidden; transition:all .25s; }
    .term-card:hover { border-color:var(--primary); }
    .term-card-header {
      padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between;
      align-items:center; gap:12px; border-left:4px solid var(--primary);
      background:linear-gradient(90deg, rgba(11,29,46,0.02), transparent);
    }
    .term-card-title { flex:1; }
    .term-card-term { font-size:14px; font-weight:700; color:var(--primary); margin-bottom:2px; }
    .term-card-full { font-size:10.5px; color:var(--gray-500); margin-bottom:3px; }
    .term-card-desc { font-size:12px; color:var(--gray-700); line-height:1.5; }
    .term-card-icon { font-size:12px; font-weight:700; color:var(--primary); }
    .term-card-detail {
      padding:16px; border-top:1px solid var(--gray-200);
      background:linear-gradient(135deg, rgba(11,29,46,0.02), rgba(200,150,58,0.02));
      font-size:12px; color:var(--gray-700); line-height:1.7; white-space:pre-line;
    }
    .term-card-example { margin-top:12px; padding:12px; background:white; border:1px solid var(--accent-light); border-radius:8px; }
    .term-card-example-label { font-size:11px; font-weight:700; color:var(--accent); margin-bottom:4px; display:block; }
    .term-card-example-text { font-size:12px; color:var(--gray-700); line-height:1.5; white-space:pre-line; }
    .terms-tip-box {
      margin-top:20px; padding:16px;
      background:linear-gradient(135deg, rgba(11,29,46,0.06), rgba(200,150,58,0.04));
      border:1px solid var(--primary-pale); border-radius:var(--r);
      font-size:12px; color:var(--primary);
    }
    .terms-tip-box strong { font-weight:700; display:block; margin-bottom:6px; }

    /* HISTORY */
    .history-container { margin-top:22px; }
    .history-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .history-header h3 { font-size:16px; font-weight:800; color:var(--dark); }
    .history-clear-btn {
      padding:7px 12px; background:var(--gray-200); color:var(--gray-800);
      border:none; border-radius:8px; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;
    }
    .history-items { display:grid; gap:8px; }
    .history-item {
      padding:12px 16px; background:white; border:1px solid var(--gray-200);
      border-radius:var(--r); cursor:pointer; transition:all .25s;
      display:flex; justify-content:space-between; align-items:center; gap:12px;
    }
    .history-item:hover { background:var(--primary-pale); border-color:var(--primary); transform:translateX(4px); }
    .history-item-info { flex:1; min-width:0; }
    .history-item-menu { font-size:12px; font-weight:700; color:var(--primary); margin-bottom:1px; }
    .history-item-time { font-size:11px; color:var(--gray-500); }
    .history-item-action { color:var(--primary); font-weight:700; white-space:nowrap; font-size:13px; }

    /* BACK */
    .back-btn {
      display:inline-flex; align-items:center; gap:6px; padding:8px 0;
      margin-top:24px; margin-bottom:4px; background:none; border:none;
      cursor:pointer; font-size:13px; font-weight:600; color:var(--primary); font-family:inherit;
    }
    .back-btn:hover { color:var(--accent); }

    /* ANIMATION */
    @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    .anim { animation:fadeUp .4s cubic-bezier(.4,0,.2,1) both; }

    /* RESPONSIVE */
    @media(max-width:768px) {
      .hero-title { font-size:24px; }
      .cat-grid { grid-template-columns:repeat(3,1fr); }
      .sector-grid { grid-template-columns:repeat(3,1fr); }
      .option-buttons.cols-4 { grid-template-columns:repeat(2,1fr); }
      .rice-steps { grid-template-columns:1fr; }
      .sec-title { font-size:18px; }
    }
    @media(max-width:480px) {
      .hero { padding:32px 16px 24px; }
      .hero-title { font-size:21px; }
      .main { padding:0 16px 60px; }
      .cat-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
      .cat-card { padding:16px 12px; }
      .sector-grid { grid-template-columns:repeat(2,1fr); }
      .stock-search { flex-direction:column; }
      .stock-search-btn { width:100%; }
    }
  </style>

<style>
  .nav-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 6px;
    padding: 12px 4px 14px;
  }
  .nav-pill {
    padding: 8px 16px; border-radius: 100px; font-size: 12.5px; font-weight: 700;
    white-space: nowrap; cursor: pointer; transition: all .2s cubic-bezier(.4,0,.2,1);
    background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.15); display: inline-flex; align-items: center; gap: 5px;
  }
  .nav-pill:hover {
    background: rgba(255,255,255,0.22); color: #fff; transform: translateY(-1px);
  }
  .nav-pill.active {
    background: linear-gradient(135deg, #C8963A 0%, #E0C068 100%);
    color: #0B1D2E !important; border-color: #E0C068;
    box-shadow: 0 4px 16px rgba(200,150,58,0.4); font-weight: 800;
  }
  @media (max-width: 768px) {
    .hero-title { font-size: 24px; }
    .hero { padding: 28px 16px 20px; }
    .main { padding: 0 14px 60px; }
    .cat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .rice-steps { grid-template-columns: 1fr; }
    .prompt-container { border-radius: 16px; padding: 16px; }
  }
</style>

</head>
<body>
  <div id="root"></div>
  <script>

const {
  useState,
  useRef,
  useEffect
} = React;

// ★ v4: 종목 사전 대폭 확장 (KOSPI 200 + KOSDAQ 시총상위 = 약 350종)

var AGENT_INSTRUCTIONS = "[역할]\n너는 나의 전담 \"AI 투자 분석 에이전트(RICE)\"다. 20년 차 증권사 리서치 애널리스트의 분석 깊이와, 냉정한 리스크 매니저의 신중함을 함께 갖췄다. 워런 버핏·찰리 멍거·벤저민 그레이엄의 가치투자, 피터 린치의 생활 속 성장주, 필립 피셔의 질적 성장, 마크 미너비니·윌리엄 오닐의 추세 관점을 균형 있게 이해한다. 너의 임무는 결론을 강요하는 것이 아니라, 내가 스스로 더 나은 판단을 내리도록 근거·관점·반대 견해를 갖춰 돕는 것이다. 최종 매수·매도 결정과 그 책임은 언제나 나에게 있다.\n\n[🚫 절대 규칙 — 신뢰성 보강]\n1) 출처 없는 수치를 단정하지 않는다 → 모든 핵심 수치 옆에 [출처: 발행처·기준연도]를 붙이고, 확인 불가하면 \"확인 불가\"로 명시한다. 지어내지 않는다.\n2) \"약·대략·추정\" 같은 모호한 표현으로 얼버무리지 않는다 → 정확한 값 또는 \"확인 불가\".\n3) 컨센서스(시장 예상치)와 실제 실적을 절대 섞지 않는다 → 반드시 (E, 예상) / (A, 실적)으로 구분 표기한다.\n4) 단정(\"무조건 오른다/지금 사라\")을 하지 않는다 → 판정은 O/△/X + 근거 + 반드시 반대 견해 1개를 함께 제시한다.\n5) 열린(자유 서술) 질문을 하지 않는다 → 언제나 번호 선택지를 제시하고 내가 번호로 답하기를 기다린다.\n6) 한 번에 한 단계만 실행한다 → 종목명만 받고 모든 분석을 쏟아내지 않는다. 단계마다 \"다음으로 갈까요?\"를 묻는다.\n7) 모든 분석의 끝에 🔰 초보자용 한 줄 해설(전문용어를 일상어로 풀기)을 붙인다.\n8) 능력 범위 밖(내가 이해 못 할 사업)이면 솔직히 \"이 사업모델은 이해가 어렵다\"고 말하고 무리해서 매수 논리를 만들지 않는다.\n\n[대화 방식 — 번호 메뉴]\n대화를 시작하면 반드시 이 메뉴부터 띄운다.\n\"무엇을 도와드릴까요? 번호로 답해 주세요.\n 1) 종목 발굴 — 뭘 살지 추천받기\n 2) 종목 분석 — 정한 종목을 파헤치기\n 3) 오늘의 시장 — 모닝 브리핑(수혜주)\n 4) ETF 찾기 — 개별주의 대안\"\n내가 번호를 고르면, 그 갈래에 필요한 항목만 번호·선택지로 묻고(그 갈래에 필요 없는 건 묻지 않는다), 항목을 다 받은 뒤 실행한다.\n\n■ 1) 종목 발굴을 고르면 다음을 묻는다: 시장?(1 한국 2 미국) / 섹터·테마?(반도체·2차전지·AI·바이오·방산·배당·전체 등) / 스타일?(1 성장 2 가치 3 배당) / 목표 수익률·기간?(예 6개월 20%) / 추천 개수?(3·5·7). → 실행 시 각 종목에 투자 포인트·핵심 지표·매수가/목표가/손절가·출처를 붙이고, 메인 후보와 서브 후보(탈락 이유 포함)를 나눈다. 끝에 \"이 중 정밀 분석할 종목이 있나요? 2번 분석으로 이어가겠습니다\"를 묻는다.\n■ 2) 종목 분석을 고르면 다음을 묻는다: 어떤 종목?(이름 또는 6자리 코드) / 어디까지?(1 빠른 SWOT · 2 핵심 SWOT+재무+밸류 · 3 전체 5단계+리스크 · 4 특정 단계만) / 투자 기간·목적?(단기 3개월/중기 6~12개월/장기 1년+, 성장·가치·배당). → 고른 범위의 단계를 순서대로 한 단계씩 실행하고, 매 단계 끝에 \"다음 단계로 갈까요, 더 깊이 볼까요?\"를 묻는다.\n■ 3) 오늘의 시장을 고르면: 관심 섹터·이벤트를 묻고 [분석 6단계]의 모닝 브리핑 규칙으로 진행한다.\n■ 4) ETF 찾기를 고르면: 목표(장기투자·배당수익·단기트레이딩)/스타일(패시브·액티브·테마)을 묻고 ETF 규칙으로 진행한다.\n\n[💡 진행 예시]\n- 내가 \"2 → 삼성전자 → 3 전체 → 중기·가치\"라고 답하면 → SWOT부터 시작해 한 단계씩, 각 단계 표 + 🔰 해설 + \"다음?\"으로 진행한다. 종목명만 받고 전부 쏟아내지 않는다.\n\n[분석 6단계 — 각 단계의 기준]\n1. SWOT 분석 (WHAT · 뭐 하는 회사인가): \"무엇으로 돈을 버는가\"를 한 문장으로 요약 + 강점·약점(내부)·기회·위협(외부). 강점×기회, 약점×위협을 대각선으로 읽어 정밀 분석 대상과 탈락을 가른다. 이 단계는 정밀검사 전의 '문진'이다.\n2. 질적 분석 (WHY · 비즈니스가 단단한가): 경제적 해자 5유형을 강/중/약/없음으로 진단한다 — ①무형자산(브랜드·특허·인허가) ②전환비용(바꾸기 번거로움) ③네트워크효과(쓸수록 가치↑) ④원가우위(구조적 저비용) ⑤효율적 규모(작은 시장 과점). 각 해자의 깊이(강도)와 방향(넓어짐/좁아짐)·지속연수를 본다. 빠른 잣대는 가격결정력(\"가격을 올려도 고객이 떠나지 않는가\"). 경영진의 정직성·자본배분, 비즈니스 모델의 지속성도 본다. 단정 대신 O/△/X + 근거 + 반대 견해. 종합 등급 Wide/Narrow/None.\n3. 재무 분석 (HOW · 숫자가 받쳐주나): 6분류 — 수익성(ROE·ROA·영업이익률·순이익률)·성장성(매출·이익 증가율, CAGR)·안정성(부채비율·유동비율·이자보상배율)·효율성(자산회전율·재고회전율)·현금흐름(영업현금흐름·잉여현금흐름)·주주환원(배당성향·배당수익률·자사주). ROE는 반드시 듀퐁 분해(순이익률 × 자산회전율 × 재무레버리지)로 \"실력(마진)인지 빚(레버리지)인지\"를 판별한다. 최근·전년·3년평균·업종평균을 함께 제시하고 3년 이상 추세를 본다. 참고 기준(강제 아님, 업종별로 다름): ROE 15%+ · 매출 CAGR 15%+ · 부채비율 100% 이하 · 이자보상배율 3배+ · OCF/순이익 80%+. 컨센서스와 실제 실적을 구분한다.\n4. 밸류에이션 (HOW MUCH · 지금 얼마짜리인가): 상대가치 PER·PBR·PEG·EV/EBITDA를 업종 평균·자사 5년 평균과 비교. 절대가치 DCF를 낙관·중립·비관 3시나리오로(각 시나리오의 핵심 가정 명시). 적정주가 밴드를 제시하고, 안전마진 20~30%를 적용한 매수가와 현재가 대비 여력(%)을 계산. 매수가는 보수·중도·공격 3옵션으로. 고PER이라도 성장(PEG)으로, 고PBR이라도 고ROE로 정당화되는지 반드시 함께 판단(밸류 트랩 경계).\n5. 기술적 분석 (WHEN · 언제 사는가, 보조): 추세(이동평균 정배열/역배열)·골든/데드크로스(후행 신호 주의)·이격도 과열·거래량·지지/저항선. 지지·손절·1차목표·2차목표를 제시. 기술은 확신이 아니라 확률이며, 펀더멘털을 뒤집지 않는 '타이밍 보조'다. 차트 단타는 권하지 않는다.\n6. 리스크 분석 (SAFETY · 잃지 않으려면): 변동성(베타·최대낙폭 MDD·연 표준편차·52주 밴드). 4갈래 고유 리스크(실적·경쟁·규제·재무)를 발생확률·영향도로 표기. 시나리오(비관·기본·낙관)별 예상 등락과 대응. 손절가·1차 익절·전량 익절 기준. 프리모템 — \"1년 뒤 이 종목이 반토막 났다\"고 가정하고 가장 그럴듯한 원인을 역추적해 '핵심 감시 지표'를 뽑는다.\n\n[섹터별로 특히 볼 것]\n- 반도체: 사이클 위치·HBM/파운드리 점유율·CAPEX·재고. - 2차전지: 수주잔고·메탈 가격·전방 EV 수요·증설. - 바이오/제약: 파이프라인 임상 단계·허가·특허만료. - 플랫폼/인터넷: MAU·ARPU·테이크레이트·규제. - 금융: 순이자마진(NIM)·연체율·자본비율(BIS). - 소비재: 브랜드력·판가 전가력·원자재. - 방산: 수주잔고·수출 승인. 컨센서스 대비 어닝 서프라이즈/쇼크를 반드시 확인.\n\n[공시·실적 확인]\n중요한 판단 전 DART 공시(사업보고서·감사의견·대량보유·자사주)와 최근 실적/컨센서스를 확인하도록 권한다. 감사의견 '적정'이 아니면 강한 경고를 준다.\n\n[교차검증]\n중요한 결론은 \"GPT·Claude·Perplexity 중 둘 이상이 공통으로 지지하는가\"를 스스로 점검하도록 권한다. 세 결과가 상충하면 양쪽 견해를 병기하고 공통분모만 신뢰하도록 안내한다.\n\n[📤 출력 형식 — 표로 60초 안에]\n각 단계는 표를 우선한다: | 지표 | 수치 | 한 줄 해석 | 출처 |. 신호등(긍정·주의·부정)으로 강조하고, 표 아래 🔰 초보자 해설, 마지막에 \"다음 단계로 갈까요, 더 깊이 볼까요?(번호로)\"를 묻는다.\n\n[🔰 초보자 해석 규칙]\n핵심 지표마다 반드시 일상어 해설을 붙인다. 예: \"PER 8배 = 지금 이익으로 8년이면 원금 회수\", \"ROE 20% = 내 돈 100원으로 1년에 20원 벌기\", \"부채비율 200% = 자기 돈의 2배를 빌림\". 숫자만 던지지 않는다.\n\n[포트폴리오]\n핵심-위성 전략으로 돕는다: 종목별 투자점수(매력도·리스크·확신도·종합), 비중·역할(핵심/주력/위성), 현금 예비자금, 섹터·자산 분산, 분할매수 계획, 리밸런싱 기준(비중 이탈 ±5%p 등). 한 종목 비중 상한을 넘지 않게 경고한다.\n\n[오늘의 시장 — 모닝 브리핑]\n장 시작 전 관점으로 4갈래 뉴스(정책·산업·기업·글로벌)를 훑고 수혜주 후보를 뽑되, 단발 테마는 \"단타 신호\"로 표시하고 반드시 위 분석 4단계로 검증하도록 안내한다. 한국 시장의 정치·정책 테마 민감성을 감안한다.\n\n[ETF 찾기]\n목표·스타일·지역에 맞는 ETF를 기본정보(운용사·순자산·보수 TER)·추적오차·괴리율·구성 TOP10·분배금으로 비교한다. 개별주 대비 분산 효과와 한계를 설명한다.\n\n[투자 판단서 — 마무리]\n분석이 끝나면 반드시 하나의 투자 판단서로 종합한다: 투자의견(매수/보류/회피)·확신도 / 목표가·매수가(안전마진 반영)·손절가·비중 / 핵심 논거 3 / 핵심 리스크 3 / 실행 전략(분할 계획) / 감시 지표 / 한 문장 요약. 끝에 \"최종 결정과 책임은 당신에게 있습니다\"를 덧붙인다.\n\n[🔎 고급 보완 질문 (선택 · A~D)]\n[A] 거장의 기준으로 재평가 — 버핏(이해가능·해자·경영진·안전마진) / 린치(PEG·생활 속 확인) / 그레이엄(안전마진·자산가치) / 미너비니(추세·타이밍)\n[B] 반대 시나리오·공매도 관점 — 이 종목을 공매도한다면 어떤 논리인가\n[C] 예상 악재 3가지 + 각 대응 논거\n[D] 유사 종목 비교표 — 같은 테마 3종목을 핵심 지표로 나란히\n\n[투자 심리 함정 경계]\n확증편향·손실회피·군중심리·앵커링·최근성 편향·처분효과를 감지하면 부드럽게 짚어주고 원칙으로 돌아오게 돕는다. \"물타기\"·\"몰빵\" 유혹이 보이면 규칙을 상기시킨다.\n\n[🔁 피드백]\n매 단계·매 갈래가 끝나면 반드시 확인한다: \"이대로 진행할까요, 이 부분을 더 깊이 볼까요? (번호로 답해 주세요)\"\n\n[유연화 규칙]\n내가 특정 지표만·특정 관점만 원하면 그 범위에 집중한다. 다만 매수 판단을 요청하면 리스크·손절·안전마진은 생략 없이 반드시 포함한다.\n\n[나만의 투자 원칙 — 아래 예시를 당신의 기준으로 바꾸세요]\n· 이해하지 못하는 사업에는 투자하지 않는다 · 안전마진 없이 매수하지 않는다 · 손절 기준 없이 진입하지 않는다 · 한 종목 비중 상한(예: 20%)을 지킨다 · 컨센서스가 아니라 내 근거로 산다 · 잃지 않는 것이 첫째, 크게 버는 것은 둘째.\n\n[예시 — 발굴은 이렇게 답한다]\n(성장주·반도체·5개 요청 시)\n| 종목 | 투자 포인트 | 매출성장 | ROE | PER | PEG | 출처 |\n| ○○전자 | AI 메모리 선점 | +40% | 22% | 11배 | 0.6 | 사업보고서 2025 |\n| △△소재 | 소재 국산화 수혜 | +28% | 18% | 15배 | 0.9 | IR 2025.2Q |\n메인 후보 2 / 서브 후보 1(밸류 부담으로 후순위). 🔰 세 AI가 공통으로 꼽은 종목만 신뢰하세요.\n\n[예시 — 질적 단계는 이렇게 답한다]\n| 해자 | 강도 | 지속 | 근거 |\n| 전환비용 | ○ 강 | 5년+ | 고객 설계 고정 [출처: 사업보고서 2025] |\n| 원가우위 | ○ 강 | 3~5년 | 규모의 경제·업종 최저 원가 |\n| 무형자산 | △ 중 | 3년 | 특허 다수, 범용화 진행 |\n→ 종합 Wide(경쟁 심화로 좁아지는 방향) · 가격결정력 中.\n반대 견해: 후발주자 증설 시 원가우위 훼손 가능.\n🔰 고객이 쉽게 못 바꾸고 원가가 낮아 잘 버는데, 경쟁이 붙어 우위가 조금씩 줄고 있어요.\n다음 단계로 갈까요, 더 깊이 볼까요?\n\n[예시 — 재무 듀퐁은 이렇게 쪼갠다]\nROE 22% = 순이익률 12% × 자산회전율 0.9 × 재무레버리지 2.0배 → 마진이 견인, 레버리지 보통 → 건강한 편.\n🔰 ROE 22%는 내 돈 100원으로 1년에 22원 번다는 뜻(우량 기준 15% 상회). 그게 실력(마진)에서 나왔는지 빚에서 나왔는지 쪼개보는 게 듀퐁이에요.\n\n[예시 — 투자 판단서는 이렇게 마무리한다]\n투자의견: 보류(관망) · 확신도 中\n목표가 ₩○○ / 매수가(안전마진 20%) ₩○○ / 손절가 ₩○○ / 비중 위성\n핵심 논거 ① … ② … ③ …  핵심 리스크 ① … ② … ③ …\n실행: 지지선 눌림 3회 분할 · 감시 지표: (핵심 변수)\n한 줄 요약: 좋은 회사지만 지금 가격은 안전마진이 얇다. 최종 결정과 책임은 당신에게 있습니다.\n\n[예시 — 밸류에이션은 이렇게 답한다]\n상대가치: PER 11배(업종 14·자사 5년 13 → 저평가) · PBR 1.8(고ROE로 정당화) · PEG 0.6\n| DCF 시나리오 | 핵심 가정 | 적정주가 | 현재 대비 |\n| 낙관 | 성장 지속·점유율 방어 | ₩○○ | +35% |\n| 중립 | 성장 점진 둔화 | ₩○○ | +18% |\n| 비관 | 경쟁 심화·단가 하락 | ₩○○ | -8% |\n적정주가 밴드 ₩○○~○○ · 안전마진 20% 매수가 ₩○○ · 매수가 3옵션(보수/중도/공격).\n🔰 PER 11배는 이익 11년치가 지금 주가란 뜻. 업종보다 싸지만, 비관 시 -8%라 안전마진 두고 분할하세요.\n\n[예시 — 리스크는 이렇게 답한다]\n변동성: 베타 1.2 · MDD -38% · 52주 밴드 ₩○○~○○\n| 리스크 | 확률 | 영향 | 내용 |\n| 경쟁 | 60% | 상 | 후발주자 증설 |\n| 실적 | 40% | 중 | 전방 수요 둔화 |\n| 규제 | 20% | 중 | 수출 규제 |\n시나리오: 비관 -25% / 기본 +12% / 낙관 +40%. 손절가 ₩○○(-15%) · 1차 익절 목표 50% 지점.\n🔮 프리모템(1년 뒤 반토막 가정): 가장 그럴듯한 원인은 \"경쟁 증설 + 단가 하락 동시\" → 감시 지표: 점유율·판가.\n🔰 베타 1.2는 시장이 10% 움직이면 이 종목은 12% 움직인다는 뜻 — 각오할 비중만 담으세요.\n\n[예시 — 오늘의 시장(모닝 브리핑)은 이렇게 답한다]\n4갈래 뉴스: 정책(○○ 지원안)·산업(○○ 업황)·기업(○○ 실적)·글로벌(금리·환율).\n수혜주 후보: A(정책 직접 수혜, 단타 신호) / B(실적 개선 동반, 분석 대상). \n→ 단발 테마 A는 \"단타 신호\"로 표시하고, B는 반드시 위 분석 4단계로 검증 후 접근하도록 안내.\n🔰 뉴스로 잡은 종목도 그날 사지 말고, 발굴→질적→재무→밸류로 한 번 걸러야 실수를 줄여요.";

      { q: '이 앱은 뭘 해주는 건가요?', a: '이 앱은 <strong>AI에게 물어볼 質문(프롬프트)을 대신 만들어주는 도구</strong>입니다.<br/>순서는 이렇습니다.<br/><strong>① 이 앱에서 메뉴 고르기 → ② 프롬프트 자동 생성 → ③ 복사 → ④ ChatGPT 같은 AI에 붙여넣기 → ⑤ AI가 분석해줌</strong><br/>즉 <strong>이 앱이 직접 분석하지는 않습니다.</strong> 좋은 질문을 만들어주는 역할입니다.' },
      { q: '여기서 뭘 입력해야 해요?', a: '입력할 게 별로 없습니다. <strong>대부분 고르기만 하면 됩니다.</strong><br/>메뉴에 들어가서 <strong>옵션을 클릭</strong>하고, 분석하고 싶은 <strong>종목 이름만</strong> 넣으면 프롬프트가 자동으로 만들어집니다.' },
      { q: '어떤 버튼을 눌러야 분석이 시작되나요?', a: '화면을 아래로 내리면 <strong>큰 황금색 버튼</strong>이 있습니다. 그걸 누르세요.<br/>그러면 아래에 긴 글(프롬프트)이 나타납니다. 그 옆의 <strong>복사</strong> 버튼을 누르면 됩니다.' },
      { q: '처음인데 어디부터 봐야 할지 모르겠어요', a: '<strong>3단계만 기억하세요.</strong><br/><strong>1.</strong> 메뉴에서 <strong>💡 종목 발굴</strong>을 눌러보세요<br/><strong>2.</strong> 옵션 몇 개 고르고 황금색 버튼 누르기<br/><strong>3.</strong> 나온 글을 복사해서 ChatGPT에 붙여넣기<br/>한 번만 해보시면 나머지 메뉴도 똑같습니다.' },
      { q: '휴대폰으로도 되나요?', a: '<strong>네, 됩니다.</strong> 휴대폰·태블릿·컴퓨터 모두 같은 주소로 쓸 수 있습니다.<br/>휴대폰에서는 화면이 좁으니 <strong>가로로 돌려서</strong> 보시면 더 편합니다.' },
      { q: '앱을 다음에 어떻게 다시 열어요?', a: '<strong>즐겨찾기(북마크)에 저장</strong>해두세요.<br/>· <strong>아이폰</strong>: 아래 <strong>공유 버튼(↑)</strong> → "홈 화면에 추가"<br/>· <strong>안드로이드</strong>: 오른쪽 위 <strong>점 세 개(⋮)</strong> → "홈 화면에 추가"<br/>그러면 앱처럼 아이콘이 생겨서 바로 열 수 있습니다.' },

    { cat: '🔑 로그인 · 비밀번호', items: [

      { q: '비밀번호를 잊어버렸어요', a: '로그인 화면 아래 <strong>"비밀번호 찾기"</strong>를 누르고 이메일을 넣으세요.<br/>재설정 메일이 갑니다. <strong>메일이 안 보이면 스팸함</strong>도 확인해주세요.' },

      { q: '비밀번호를 바꾸라고 나와요', a: '<strong>정상입니다.</strong> 관리자가 만들어준 임시 비밀번호는 보안을 위해 <strong>처음 한 번만</strong> 쓸 수 있습니다.<br/>본인이 기억하기 쉬운 <strong>6자 이상</strong>의 비밀번호를 두 칸에 <strong>똑같이</strong> 넣고 저장하시면 됩니다.' },
      { q: '가입했는데 승인 대기라고 나와요', a: '관리자가 확인 후 승인해드리는 방식입니다.<br/>승인되면 <strong>지금 쓰신 이메일과 비밀번호 그대로</strong> 로그인하시면 바로 이용됩니다.<br/>급하시면 <strong>realleadership@naver.com</strong>으로 알려주세요.' },

    { cat: '📋 복사 · 붙여넣기 (가장 많이 묻는 질문)', items: [
      { q: '복사 버튼을 눌렀는데 아무 일도 안 일어나요', a: '<strong>정상입니다.</strong> 복사는 화면이 바뀌지 않습니다.<br/>버튼이 잠깐 <strong>"✓ 복사됨"</strong>으로 바뀌면 성공한 것입니다. 글은 <strong>보이지 않는 곳에 담겨</strong> 있고, 이제 다른 곳에 붙여넣기만 하면 됩니다.' },
      { q: '붙여넣기는 어떻게 해요?', a: '· <strong>컴퓨터</strong>: 붙여넣을 칸을 클릭하고 <strong>Ctrl + V</strong> (맥은 <strong>Cmd + V</strong>)<br/>· <strong>휴대폰</strong>: 입력창을 <strong>손가락으로 1~2초 꾹 누르면</strong> "붙여넣기"가 뜹니다. 그걸 누르세요.' },
      { q: '휴대폰에서 붙여넣기가 안 돼요', a: '입력창을 <strong>정확히 그 안쪽을 꾹</strong> 눌러야 합니다. 살짝 누르면 안 나옵니다.<br/>1~2초 누르고 있으면 작은 검은 창에 <strong>"붙여넣기"</strong>가 뜹니다.<br/>그래도 안 되면 복사를 다시 한 번 눌러보세요.' },
      { q: '복사한 게 사라졌어요', a: '복사한 내용은 <strong>다른 걸 복사하면 지워집니다.</strong> 하나만 보관됩니다.<br/>이 앱으로 돌아와서 <strong>복사 버튼을 다시 누르면</strong> 됩니다. 언제든 다시 복사할 수 있습니다.' },
      { q: 'ChatGPT 어디에 붙여넣어요?', a: 'ChatGPT를 열면 화면 <strong>맨 아래에 긴 입력창</strong>이 있습니다. ("무엇이든 물어보세요" 같은 글씨가 있는 칸)<br/>거기를 누르고 붙여넣은 다음, 오른쪽 <strong>화살표(↑) 버튼</strong>을 누르면 됩니다.' },

    { cat: '🤖 AI(ChatGPT) 사용법', items: [
      { q: 'ChatGPT가 뭐예요?', a: '사람처럼 대화하며 글을 써주는 <strong>인공지능 서비스</strong>입니다.<br/>이 앱이 만든 질문을 붙여넣으면, ChatGPT가 <strong>애널리스트처럼 분석해서</strong> 답을 써줍니다.<br/>인터넷에서 <strong>chatgpt.com</strong>으로 접속하거나 앱을 설치해서 쓰시면 됩니다.' },
      { q: 'ChatGPT 어떻게 시작해요?', a: '<strong>①</strong> 인터넷 주소창에 <strong>chatgpt.com</strong> 입력<br/><strong>②</strong> 구글 계정이나 이메일로 <strong>가입(무료)</strong><br/><strong>③</strong> 아래 입력창에 이 앱에서 복사한 글을 붙여넣기<br/>Claude(claude.ai)나 Perplexity(perplexity.ai)도 같은 방식입니다.' },
      { q: 'AI가 답을 안 해주거나 이상한 답을 해요', a: '이럴 때는 이렇게 해보세요.<br/><strong>①</strong> 프롬프트를 <strong>전부</strong> 붙여넣었는지 확인 (일부만 들어가면 엉뚱한 답이 나옵니다)<br/><strong>②</strong> <strong>웹 검색 기능을 켜고</strong> 다시 물어보기<br/><strong>③</strong> "다시 답해줘"라고 한 번 더 요청하기' },
      { q: '웹 검색을 켜라는 게 무슨 말이에요?', a: 'AI가 <strong>인터넷에서 최신 정보를 찾아보게</strong> 하는 기능입니다.<br/>이걸 안 켜면 AI가 <strong>예전 정보로만</strong> 답해서 주가나 실적이 틀릴 수 있습니다.<br/>ChatGPT는 입력창 아래 <strong>도구/Tools</strong>에서, Claude는 입력창 근처 토글에서 켤 수 있습니다.' },
      { q: 'Deep Research가 뭐예요?', a: 'AI가 <strong>시간을 더 들여 깊이 조사</strong>하는 모드입니다. 보통 몇 분 걸리지만 훨씬 자세한 답을 줍니다.<br/>종목을 진지하게 볼 때는 이 모드를 켜시는 걸 권합니다. (유료 구독에서 제공됩니다)' },
      { q: '답이 너무 길어서 읽기 힘들어요', a: 'AI에게 이렇게 <strong>이어서 말하면</strong> 됩니다.<br/>· <strong>"위 내용을 5줄로 요약해줘"</strong><br/>· <strong>"어려운 용어를 쉬운 말로 바꿔줘"</strong><br/>· <strong>"결론만 알려줘"</strong>' },
      { q: 'ChatGPT 구독이 없어도 되나요?', a: '무료로도 쓸 수 있지만 <strong>답 품질 차이가 큽니다.</strong><br/>Deep Research 같은 핵심 기능은 유료에서만 제공됩니다. <strong>3개 중 최소 2개</strong>는 구독하시는 걸 권합니다.' },
      { q: '어떤 AI 2개를 선택해야 좋나요?', a: '<strong>Claude + Perplexity</strong> 조합을 가장 추천합니다.<br/>· <strong>Claude</strong> — 깊이 있는 추론과 분석<br/>· <strong>Perplexity</strong> — 최신 자료 검색<br/>· <strong>ChatGPT</strong> — 두루 잘하는 무난한 선택' },
      { q: '교차검증은 왜 3개 AI를 써요?', a: 'AI도 <strong>가끔 틀린 답(환각)</strong>을 합니다.<br/>같은 질문을 3개 AI에 던져서 <strong>공통으로 나온 답만</strong> 믿으면 훨씬 안전합니다.<br/>의견이 갈리는 항목은 <strong>한 번 더 확인</strong>하시면 됩니다.' },
    ]},

    { cat: '📈 주식 용어 쉽게', items: [
      { q: '종목 코드가 뭐예요?', a: '주식마다 붙은 <strong>고유 번호</strong>입니다. 한국은 <strong>숫자 6자리</strong>입니다.<br/>예) 삼성전자 = <strong>005930</strong><br/>이 앱에서는 <strong>회사 이름만 입력해도</strong> 자동으로 찾아줍니다.' },
      { q: 'PER · PBR이 뭐예요?', a: '주식이 <strong>비싼지 싼지</strong> 재는 자<br/>· <strong>PER</strong> — 버는 돈 대비 주가. <strong>낮을수록 저렴</strong>합니다<br/>· <strong>PBR</strong> — 회사 재산 대비 주가. <strong>1보다 낮으면</strong> 재산보다 싸게 거래된다는 뜻<br/>단, 업종마다 기준이 달라서 <strong>같은 업종끼리 비교</strong>해야 합니다.' },
      { q: 'BUY · HOLD · SELL이 무슨 뜻인가요?', a: '· <strong>BUY(바이)</strong> = 매수 추천 (사라)<br/>· <strong>HOLD(홀드)</strong> = 관망 (그냥 두라)<br/>· <strong>SELL(셀)</strong> = 매도 추천 (팔아라)<br/>AI 의견일 뿐이니 <strong>참고용</strong>으로만 봐주세요.' },
      { q: '목표가는 어떻게 봐야 하나요?', a: 'AI가 추정한 <strong>"이 정도가 적정하다"</strong>는 가격입니다.<br/>현재가보다 높으면 오를 여지가 있다는 의견이지만, <strong>예측은 자주 빗나갑니다.</strong> 절대 맹신하지 마세요.' },
      { q: '손절이 뭐예요? 기준은 어떻게 정해요?', a: '<strong>손해를 확정하고 파는 것</strong>입니다. 더 큰 손실을 막기 위한 안전장치입니다.<br/>보통 산 가격보다 <strong>7~10% 떨어지면</strong> 파는 분이 많습니다.<br/>이 앱의 <strong>⚠️ 리스크 분석</strong> 메뉴를 쓰면 AI가 손절가를 같이 제안해줍니다.' },
      { q: '시가총액이 뭐예요?', a: '<strong>회사 전체의 가격표</strong>입니다. (주가 × 발행 주식 수)<br/>· <strong>클수록</strong> 크고 안정적인 회사 (삼성전자 등)<br/>· <strong>작을수록</strong> 잘 오르내리는 회사 — 기회도 크지만 위험도 큽니다' },
      { q: '배당이 뭐예요?', a: '회사가 번 돈의 일부를 <strong>주주에게 나눠주는 것</strong>입니다.<br/>은행 이자처럼 <strong>가지고만 있어도</strong> 받습니다. 단, 회사가 어려우면 <strong>안 줄 수도</strong> 있습니다.' },
      { q: 'ETF가 뭐예요?', a: '<strong>여러 종목을 한 바구니에 담아놓은 상품</strong>입니다.<br/>하나만 사도 수십 개 회사에 <strong>나눠서 투자</strong>하는 효과가 있어 <strong>위험이 분산</strong>됩니다.<br/>어떤 종목을 골라야 할지 어려우신 분께 적합합니다.' },
      { q: '코스피와 코스닥은 뭐가 달라요?', a: '· <strong>코스피</strong> — 크고 오래된 회사들 (삼성전자, 현대차 등). 비교적 <strong>안정적</strong><br/>· <strong>코스닥</strong> — 중소·벤처 회사들. <strong>변동이 큽니다</strong> (많이 오르내림)' },
    ]},

    { cat: '🖥 앱 사용 중 문제', items: [
      { q: '글씨가 너무 작아요', a: '화면 위쪽에 <strong>🔍 글자 − 120% +</strong> 가 있습니다. <strong>+</strong>를 누르면 커집니다.<br/>더 크게 하려면 <strong>Ctrl + 키</strong> (맥은 <strong>Cmd + 키</strong>)를 여러 번 누르세요.' },
      { q: '화면이 멈춘 것 같아요', a: '이 앱은 AI에 직접 묻지 않아서 <strong>거의 모든 동작이 즉시</strong> 끝납니다.<br/>멈춘 것 같으면 <strong>새로고침</strong>을 해보세요. (컴퓨터는 <strong>F5</strong>, 휴대폰은 화면을 <strong>아래로 쭉 당기기</strong>)' },
      { q: '종목이 검색되지 않아요', a: '· <strong>정식 회사 이름</strong>으로 넣어보세요 (예: "삼전" ❌ → "삼성전자" ⭕)<br/>· <strong>띄어쓰기</strong>를 빼고 넣어보세요<br/>· 그래도 안 되면 <strong>종목 코드 6자리</strong>를 직접 입력하세요' },

    '기간이 남았는데 연장하면 손해인가요?': ['남았는데', '미리연장', '손해인가', '남은기간'],

    // ── 꼭 알아두실 점 ──────────────────────────────────
    '이 종목 사도 되나요?': ['사도', '살까', '괜찮을까', '추천종목', '사야하', '어때요'],
    'AI 말대로 했는데 손해를 봤어요': ['손해봤', '잃었', '떨어졌', '마이너스', '물렸', '손실'],
    '원금이 보장되나요?': ['원금', '보장', '안전한가', '위험한가'],
    'AI 추천을 믿어도 되나요?': ['믿어도', '신뢰', '정확한가', '맞나요', '확실한'],
    '누군가 수익을 보장한다고 하면요?': ['수익보장', '리딩', '단톡', '사기', '먹튀', '고수익'],

    // ── 그 밖에 ─────────────────────────────────────────
    '실전 강의는 언제 열리나요?': ['강의', '수업', '오프라인', '교육', '강좌', '배우고싶', '수강'],
    '문의는 어디로 하나요?': ['문의', '연락', '전화번호', '이메일주소', '물어볼', '고객센터', '상담'],
    '건의하고 싶은 기능이 있어요': ['건의', '제안', '기능추가', '불편', '개선', '바라는'],
  };

  const norm = (s) => (s || '').toLowerCase().replace(/[\s·.,?!"'()\-]/g, '');
  // 2글자씩 잘라 겹치는 정도를 본다 (한국어는 조사·어미가 붙어 단어 일치가 잘 안 됨)
  function bigramScore(a, b) {
    if (a.length < 2 || b.length < 2) return 0;
    const set = new Set();
    for (let i = 0; i < b.length - 1; i++) set.add(b.slice(i, i + 2));
    let hit = 0, tot = 0;
    for (let i = 0; i < a.length - 1; i++) { tot++; if (set.has(a.slice(i, i + 2))) hit++; }
    return tot ? hit / tot : 0;
  }

  function findAnswer(spoken) {
    const s = norm(spoken);
    if (!s) return null;
    let best = null, bestScore = 0;
    QA.forEach((cat) => cat.items.forEach((item) => {
      let score = bigramScore(s, norm(item.q)) * 1.0;
      const keys = VOICE_KEYS[item.q] || [];
      keys.forEach((k) => { if (s.indexOf(norm(k)) !== -1) score += 0.7; });
      if (score > bestScore) { bestScore = score; best = item; }
    }));
    // 너무 안 맞으면 억지로 답하지 않는다 — 엉뚱한 답이 더 나쁘다
    return bestScore >= 0.7 ? { item: best, score: bestScore } : null;
  }

  // 확신이 없을 때 "혹시 이거 찾으세요?"로 보여줄 후보를 점수순으로 뽑는다.
  // 어르신은 자기 말이 어떻게 인식됐는지 모른 채 "답이 없다"만 보면 그대로 포기한다.
  // 가까운 질문 몇 개를 눌러볼 수 있게 주는 편이 훨씬 낫다.
  function rankCandidates(spoken, n) {
    const s = norm(spoken);
    if (!s) return [];
    const out = [];
    QA.forEach((cat) => cat.items.forEach((item) => {
      let score = bigramScore(s, norm(item.q));
      (VOICE_KEYS[item.q] || []).forEach((k) => { if (s.indexOf(norm(k)) !== -1) score += 0.7; });
      if (score >= 0.2) out.push({ item, score });
    }));
    return out.sort((a, b) => b.score - a.score).slice(0, n || 3);
  }

  // ── 읽어주기 (TTS) ─────────────────────────────────────────────────
  const synth = window.speechSynthesis || null;
  function stripTags(html) {
    const d = document.createElement('div');
    d.innerHTML = html.replace(/<br\s*\/?>/gi, ' ');
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function speak(text, btn) {
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(stripTags(text));
    u.lang = 'ko-KR';
    u.rate = 0.92;   // 시니어 대상이라 조금 천천히
    if (btn) {
      btn.classList.add('on'); btn.textContent = '⏹ 그만 읽기';
      const done = () => { btn.classList.remove('on'); btn.textContent = '🔊 읽어주기'; };
      u.onend = done; u.onerror = done;
    }
    synth.speak(u);
  }
  function stopSpeaking() { if (synth) synth.cancel(); }

  // ── 못 찾은 질문을 관리자에게 전달 ─────────────────────────────────
  // FAQ 를 우리가 추측으로 늘리는 데는 한계가 있다. 실제로 어르신이 물었는데
  // 답이 없었던 말을 그대로 모아두면, 그게 다음에 채울 FAQ 목록이 된다.
  function reportUnanswered(text) {
    try {
      const auth = firebase.auth();
      // 책·강의 앱은 로그인이 없다. 그 독자들이야말로 우리가 알고 싶은 층이라
      // 익명이어도 질문을 받는다. 유료 앱에서는 익명 세션을 받지 않는다.
      if (!auth || !auth.currentUser) return;
      if (auth.currentUser.isAnonymous && !window.__riceIsBook) return;
      firebase.app().functions('asia-northeast3').httpsCallable('logUnanswered')({
        text: text,
        menu: window.__v12_currentMenu || '',
        source: 'voice',
      }).then(function (r) {
        if (!(r && r.data && r.data.ok)) return;
        const el = document.getElementById('v12-voice-status');
        if (el) el.innerHTML = '✅ 이 질문을 관리자에게 전달했어요'
          + '<br><span style="font-size:12px">답변이 준비되면 목록에 추가됩니다</span>';
      }).catch(function () { /* 전달 실패는 사용자에게 알리지 않는다 */ });
    } catch (_) { /* firebase 미초기화 등 */ }
  }

  const body = document.getElementById('v12-chatbot-body');
  let answerEl = null;
  let activeBtn = null;

  function renderQA() {
    let html = '';
    // ⚠️ ID 는 반드시 "전체에서 유일한 일련번호"로 만들 것.
    //    예전 코드는 카테고리 이름에서 영문·숫자만 남겨 ID 를 만들었는데,
    //    카테고리가 전부 한글·이모지라 대부분 빈 문자열이 되어 ID 가 겹쳤다.
    //    그러면 getElementById 가 첫 번째 칸만 찾아서, 답이 엉뚱한 곳(화면 밖)에 열린다.
    let seq = 0;
    QA.forEach(cat => {
      html += '<div class="v12-cb-cat">' + cat.cat + '</div>';
      cat.items.forEach((item) => {
        const id = 'q' + (seq++);
        html += '<button class="v12-cb-q" data-id="' + id + '" data-a="' + encodeURIComponent(item.a) + '">' + item.q + '</button>';
        html += '<div class="v12-cb-a-slot" id="slot-' + id + '"></div>';
      });
    });
    body.innerHTML = html;
    body.querySelectorAll('.v12-cb-q').forEach(btn => {
      btn.addEventListener('click', () => {
        if (activeBtn === btn) { closeAnswer(); return; }
        openAnswer(btn, false);
      });
    });
  }

  function closeAnswer() {
    stopSpeaking();
    body.querySelectorAll('.v12-cb-a-slot').forEach(s => s.innerHTML = '');
    body.querySelectorAll('.v12-cb-q').forEach(b => b.classList.remove('active'));
    activeBtn = null;
  }

  function openAnswer(btn, autoSpeak) {
    closeAnswer();
    const html = decodeURIComponent(btn.dataset.a);
    const slot = document.getElementById('slot-' + btn.dataset.id);
    slot.innerHTML = '<div class="v12-cb-a">' + html
      + (synth ? '<div><button class="v12-speak">🔊 읽어주기</button></div>' : '')
      + '</div>';
    btn.classList.add('active');
    activeBtn = btn;
    const sp = slot.querySelector('.v12-speak');
    if (sp) sp.addEventListener('click', () => {
      if (sp.classList.contains('on')) { stopSpeaking(); sp.classList.remove('on'); sp.textContent = '🔊 읽어주기'; }
      else speak(html, sp);
    });
    btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (autoSpeak && sp) speak(html, sp);
  }

  // 음성으로 들어온 질문을 해당 항목으로 연결한다
  function openByQuestion(qText, autoSpeak) {
    const target = Array.prototype.slice.call(body.querySelectorAll('.v12-cb-q'))
      .filter(b => b.textContent === qText)[0];
    if (target) openAnswer(target, autoSpeak);
    return !!target;
  }

  renderQA();

  // ── 관리자가 공개한 추가 FAQ 불러오기 ──────────────────────────────
  // 회원 질문에서 자란 항목들이다. 앱을 다시 배포하지 않아도 여기로 들어온다.
  function updateCount() {
    const el = document.getElementById('v12-cb-count');
    const n = QA.reduce((s, c) => s + c.items.length, 0);
    if (el) el.textContent = '자주 묻는 질문 ' + n + '개 · 🎤 말로 물어보세요';
  }
  let remoteLoaded = false;
  function loadRemoteFaq() {
    if (remoteLoaded) return;
    remoteLoaded = true;
    try {
      const auth = firebase.auth();
      if (!auth || !auth.currentUser) { remoteLoaded = false; return; }
      if (auth.currentUser.isAnonymous && !window.__riceIsBook) { remoteLoaded = false; return; }
      firebase.app().functions('asia-northeast3').httpsCallable('faqList')({}).then(function (r) {
        const items = (r && r.data && r.data.items) || [];
        if (!items.length) return;
        let added = 0;
        items.forEach(function (it) {
          if (!it.q || !it.a) return;
          // 이미 같은 질문이 있으면 건너뛴다
          if (QA.some((c) => c.items.some((x) => x.q === it.q))) return;
          let cat = QA.filter((c) => c.cat.indexOf(it.cat) !== -1)[0];
          if (!cat) { cat = { cat: '🆕 ' + (it.cat || '그 밖에'), items: [] }; QA.push(cat); }
          cat.items.push({ q: it.q, a: it.a });
          if (it.k && it.k.length) VOICE_KEYS[it.q] = it.k;
          added++;
        });
        if (added) { renderQA(); updateCount(); }
      }).catch(function () { remoteLoaded = false; });
    } catch (_) { remoteLoaded = false; }
  }

  // ── 마이크 (음성 인식) ─────────────────────────────────────────────
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const bar = document.getElementById('v12-voice-bar');
  const mic = document.getElementById('v12-mic');
  const micLabel = document.getElementById('v12-mic-label');
  const status = document.getElementById('v12-voice-status');
  const heard = document.getElementById('v12-voice-heard');
  let rec = null, listening = false;
  // 후보를 보여준 뒤 아무것도 안 누르면 그때 "답 없는 질문"으로 기록하기 위한 타이머
  let reportTimer = null;

  function setHeard(html) {
    if (!html) { heard.style.display = 'none'; heard.innerHTML = ''; return; }
    heard.style.display = 'block'; heard.innerHTML = html;
  }
  function micIdle() {
    listening = false;
    mic.classList.remove('listening');
    micLabel.textContent = '눌러서 말하세요';
  }

  if (SR) {
    bar.style.display = 'flex'; // 지원하는 브라우저에서만 노출

    mic.addEventListener('click', () => {
      if (listening) { try { rec.stop(); } catch (_) {} return; }
      stopSpeaking();
      setHeard('');
      rec = new SR();
      rec.lang = 'ko-KR';
      rec.interimResults = false;
      rec.maxAlternatives = 3;

      rec.onstart = () => {
        listening = true;
        mic.classList.add('listening');
        micLabel.textContent = '듣고 있어요… (누르면 중지)';
        status.textContent = '천천히 또박또박 말씀해주세요';
      };
      rec.onerror = (e) => {
        micIdle();
        status.textContent = e.error === 'not-allowed'
          ? '마이크 사용이 차단돼 있어요. 주소창 옆 자물쇠에서 마이크를 허용해주세요.'
          : (e.error === 'no-speech' ? '소리가 들리지 않았어요. 다시 눌러서 말씀해주세요.' : '인식에 실패했어요. 다시 시도해주세요.');
      };
      rec.onend = () => { micIdle(); };
      rec.onresult = (e) => {
        // 후보를 여러 개 받아 그중 가장 잘 맞는 걸 고른다 (인식 오차 보정)
        const alts = Array.prototype.slice.call(e.results[0]).map(a => a.transcript);
        let picked = null, spoken = alts[0] || '';
        for (const a of alts) { const m = findAnswer(a); if (m && (!picked || m.score > picked.score)) { picked = m; spoken = a; } }

        setHeard('<b>"' + spoken + '"</b>');
        if (picked) {
          status.textContent = '답변을 찾았어요 · 읽어드릴게요';
          openByQuestion(picked.item.q, true);
          return;
        }

        // 확신이 없을 때 — "답이 없다"로 끝내지 않는다.
        // 어르신은 자기 말이 어떻게 인식됐는지 모르기 때문에, 거기서 그냥 포기한다.
        // 가까운 질문을 눌러볼 수 있게 주고, 그래도 안 맞으면 그때 관리자에게 보낸다.
        // (연락처는 절대 여기 쓰지 않는다. 질문을 모으려고 만든 기능인데
        //  메일 주소를 보여주면 오히려 메일이 오게 되어 목적이 뒤집힌다.)
        const cands = rankCandidates(spoken, 3);
        if (cands.length) {
          status.textContent = '';
          setHeard('<b>"' + spoken + '"</b><br>'
            + '<span style="font-size:13px">혹시 이걸 찾으세요? 눌러보세요.</span>'
            + '<div id="v12-cands" style="margin-top:9px;display:flex;flex-direction:column;gap:6px"></div>');
          const box = document.getElementById('v12-cands');
          cands.forEach(function (c) {
            const b = document.createElement('button');
            b.textContent = c.item.q;
            b.style.cssText = 'text-align:left;padding:11px 13px;border:1px solid #9A7B3A;'
              + 'background:#fff;border-radius:9px;font-size:14px;font-weight:700;color:#0B1D2E;'
              + 'cursor:pointer;font-family:inherit;line-height:1.45;';
            b.onclick = function () {
              clearTimeout(reportTimer);          // 눌렀으면 해결된 질문이다
              status.textContent = '답변을 읽어드릴게요';
              openByQuestion(c.item.q, true);
            };
            box.appendChild(b);
          });
          // 아무것도 안 누르면 그때 "답이 없는 질문"으로 기록한다
          clearTimeout(reportTimer);
          reportTimer = setTimeout(function () { reportUnanswered(spoken); }, 12000);
        } else {
          status.textContent = '';
          setHeard('<b>"' + spoken + '"</b><br>비슷한 질문을 못 찾았어요.<br>'
            + '<span style="font-size:12.5px;color:#64748b">아래 목록에서 골라보시거나, 다르게 한 번 더 말씀해주세요.</span>');
          reportUnanswered(spoken);
        }
      };

      try { rec.start(); }
      catch (_) { micIdle(); status.textContent = '마이크를 시작할 수 없어요. 페이지를 새로고침해주세요.'; }
    });
  }

  window.v12ToggleChatbot = function() {
    const panel = document.getElementById('v12-chatbot-panel');
    const open = panel.classList.toggle('open');
    if (open) loadRemoteFaq(); // 열 때 최신 FAQ 를 받아온다
    if (!open) { // 닫을 때는 말하기·듣기 모두 정리
      stopSpeaking();
      if (listening && rec) { try { rec.stop(); } catch (_) {} }
    }
  };
})();
</script>


<script>
window.showToast = function(msg) {
  let toast = document.getElementById('rice-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'rice-toast';
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(11,29,46,0.95);color:#fff;padding:12px 24px;border-radius:100px;font-size:13.5px;font-weight:600;z-index:99999;box-shadow:0 8px 30px rgba(0,0,0,0.3);border:1px solid #C8963A;display:flex;align-items:center;gap:8px;transition:all .3s ease;pointer-events:none;opacity:0;';
    document.body.appendChild(toast);
  }
  toast.innerText = msg;
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  if (window._toastTimer) clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(10px)';
  }, 3200);
};
</script>
